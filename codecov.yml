coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    patch:
      # codecov/patch stays .NET-only, as before PowerShell coverage was added.
      default:
        flags:
          - unittests
      # PowerShell (Pester) starts as informational (#256). Decide later whether
      # to make it a gate once the numbers are stable.
      powershell:
        flags:
          - powershell
        informational: true

flags:
  unittests:
    paths:
      - PhotoGeoExplorer/
      - PhotoGeoExplorer.Core/
  powershell:
    paths:
      - scripts/

fixes:
  - 'D:/a/PhotoGeoExplorer/PhotoGeoExplorer/::'

ignore:
  - "PhotoGeoExplorer.Tests/**"
  - "PhotoGeoExplorer.E2E/**"
  - "PhotoGeoExplorer/Panes/**/*View.xaml.cs"
  # Same View-layer policy for the *ViewControl.xaml.cs code-behinds
  # (MapPaneViewControl / PreviewPaneViewControl), which the pattern above
  # does not match. Their Loaded/Unloaded lifecycle depends on WinUI event
  # ordering and cannot be reproduced in xUnit. Logic stays in ViewModels. (#278)
  - "PhotoGeoExplorer/Panes/**/*ViewControl.xaml.cs"
  # View-layer UI construction helpers (create WinRT types directly;
  # not unit-testable; View responsibility per MVVM guardrails).
  # Split out from *View.xaml.cs, so exclude them too. Testable pure
  # functions (FileBrowserDialogErrorMap), ViewModels and Services
  # stay tracked (no blanket exclusion). Details: #171
  # NOTE: keep this file ASCII-only -- the Codecov CLI fails to decode
  # non-ASCII bytes on the Windows runner.
  - "PhotoGeoExplorer/Panes/FileBrowser/FileBrowserDialogs.cs"
  - "PhotoGeoExplorer/Panes/FileBrowser/FileBrowserDragDropHandler.cs"
  - "PhotoGeoExplorer/Panes/FileBrowser/FileBrowserMenuBuilder.cs"
