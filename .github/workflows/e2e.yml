name: E2E

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    env:
      SIXLABORS_LICENSE_KEY: ${{ vars.SIXLABORS_LICENSE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhotoGeoExplorer.sln

      - name: Build
        run: dotnet build PhotoGeoExplorer.sln -c Release -p:Platform=x64 -p:TreatWarningsAsErrors=true -p:AnalysisLevel=latest

      - name: Ensure Windows App SDK runtime
        shell: pwsh
        run: |
          $runtime = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.8*" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            Write-Host "Windows App SDK runtime 1.8 not found. Installing..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id Microsoft.WindowsAppRuntime.1.8 --accept-source-agreements --accept-package-agreements --silent
            } else {
              $uri = "https://aka.ms/windowsappsdk/1.8/latest/Microsoft.WindowsAppRuntime.1.8.x64.msix"
              $msix = Join-Path $env:RUNNER_TEMP "Microsoft.WindowsAppRuntime.1.8.x64.msix"
              Invoke-WebRequest -Uri $uri -OutFile $msix
              Add-AppxPackage -Path $msix
            }
          }

          $runtime = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.8*" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            throw "Windows App SDK runtime 1.8 installation verification failed."
          }

      - name: Set display resolution
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class DisplaySettings {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              private const int CCHDEVICENAME = 32;
              private const int CCHFORMNAME = 32;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = CCHDEVICENAME)]
              public string dmDeviceName;
              public short dmSpecVersion;
              public short dmDriverVersion;
              public short dmSize;
              public short dmDriverExtra;
              public int dmFields;
              public int dmPositionX;
              public int dmPositionY;
              public int dmDisplayOrientation;
              public int dmDisplayFixedOutput;
              public short dmColor;
              public short dmDuplex;
              public short dmYResolution;
              public short dmTTOption;
              public short dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = CCHFORMNAME)]
              public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel;
              public int dmPelsWidth;
              public int dmPelsHeight;
              public int dmDisplayFlags;
              public int dmDisplayFrequency;
              public int dmICMMethod;
              public int dmICMIntent;
              public int dmMediaType;
              public int dmDitherType;
              public int dmReserved1;
              public int dmReserved2;
              public int dmPanningWidth;
              public int dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet=CharSet.Ansi)]
            public static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);
          }
          "@
          $dev = New-Object DisplaySettings+DEVMODE
          $dev.dmSize = [System.Runtime.InteropServices.Marshal]::SizeOf($dev)
          $dev.dmPelsWidth = 1920
          $dev.dmPelsHeight = 1080
          $dev.dmFields = 0x80000 -bor 0x100000
          [DisplaySettings]::ChangeDisplaySettings([ref]$dev, 0) | Out-Null

      - name: Run E2E tests
        shell: pwsh
        run: |
          $maxAttempts = 2
          $passed = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $resultFile = "e2e-results-attempt$attempt.trx"
            Write-Host "Running E2E tests (attempt $attempt/$maxAttempts)..."
            $testArgs = @(
              "PhotoGeoExplorer.E2E/PhotoGeoExplorer.E2E.csproj",
              "-c", "Release",
              "--no-build",
              "--logger", "trx;LogFileName=$resultFile",
              "--results-directory", "TestResults",
              "--blame-hang-timeout", "10m"
            )

            dotnet test @testArgs
            if ($LASTEXITCODE -eq 0) {
              $passed = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "E2E tests failed on attempt $attempt. Retrying once..."
              Get-Process -Name PhotoGeoExplorer -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 3
            }
          }

          if (-not $passed) {
            throw "E2E tests failed after $maxAttempts attempts."
          }
        env:
          PHOTO_GEO_EXPLORER_RUN_E2E: "1"

      - name: Collect E2E diagnostics
        if: always()
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "E2EArtifacts"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null

          $resultsSource = Join-Path $PWD "TestResults"
          if (Test-Path $resultsSource) {
            try {
              Copy-Item -Path $resultsSource -Destination (Join-Path $artifactRoot "TestResults") -Recurse -Force
            } catch {
              Write-Warning "Failed to copy E2E test results from '$resultsSource': $_"
            }
          }

          $diagnosticsSource = Join-Path $env:TEMP "PhotoGeoExplorerE2E\\Diagnostics"
          if (Test-Path $diagnosticsSource) {
            try {
              Copy-Item -Path $diagnosticsSource -Destination (Join-Path $artifactRoot "Diagnostics") -Recurse -Force
            } catch {
              Write-Warning "Failed to copy E2E diagnostics from '$diagnosticsSource': $_"
            }
          }

          $appLogSource = Join-Path $env:LOCALAPPDATA "PhotoGeoExplorer\\Logs"
          if (Test-Path $appLogSource) {
            try {
              Copy-Item -Path $appLogSource -Destination (Join-Path $artifactRoot "AppLogs") -Recurse -Force
            } catch {
              Write-Warning "Failed to copy app logs from '$appLogSource': $_"
            }
          }

          try {
            $processSnapshotPath = Join-Path $artifactRoot "process-snapshot.json"
            $processes = Get-Process -Name PhotoGeoExplorer -ErrorAction SilentlyContinue | Select-Object Name, Id, StartTime
            if ($processes) {
              $processes | ConvertTo-Json -Depth 3 | Set-Content -Path $processSnapshotPath -Encoding utf8
            } else {
              "[]" | Set-Content -Path $processSnapshotPath -Encoding utf8
            }
          } catch {
            Write-Warning "Failed to collect process snapshot for 'PhotoGeoExplorer': $_"
          }

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: E2EArtifacts/
          if-no-files-found: warn
          retention-days: 14
