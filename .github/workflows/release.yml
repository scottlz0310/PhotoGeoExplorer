# GitHub Actions workflow for release packaging

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            Write-Error "Tag must start with 'v' (example: v1.0.0)."
            exit 1
          }
          $version = $tag.TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Tag version is empty."
            exit 1
          }

          [xml]$manifest = Get-Content -Path "PhotoGeoExplorer/Package.appxmanifest" -Raw
          $manifestVersion = $manifest.Package.Identity.Version
          $expectedManifest = "$version.0"
          if ($manifestVersion -ne $expectedManifest) {
            Write-Error "Appxmanifest Version ($manifestVersion) must match $expectedManifest."
            exit 1
          }

          [xml]$app = Get-Content -Path "PhotoGeoExplorer/PhotoGeoExplorer.csproj" -Raw
          $appVersion = ($app.Project.PropertyGroup.Version | Select-Object -First 1).Trim()
          if ($appVersion -ne $version) {
            Write-Error "App Version ($appVersion) must match tag ($version)."
            exit 1
          }

          $expectedAssembly = "$version.0"
          $assemblyVersion = ($app.Project.PropertyGroup.AssemblyVersion | Select-Object -First 1).Trim()
          if ($assemblyVersion -ne $expectedAssembly) {
            Write-Error "AssemblyVersion ($assemblyVersion) must match $expectedAssembly."
            exit 1
          }

          $fileVersion = ($app.Project.PropertyGroup.FileVersion | Select-Object -First 1).Trim()
          if ($fileVersion -ne $expectedAssembly) {
            Write-Error "FileVersion ($fileVersion) must match $expectedAssembly."
            exit 1
          }

          $infoVersion = ($app.Project.PropertyGroup.InformationalVersion | Select-Object -First 1).Trim()
          if ($infoVersion -ne $version) {
            Write-Error "InformationalVersion ($infoVersion) must match tag ($version)."
            exit 1
          }

          $changelog = Get-Content -Path "CHANGELOG.md"
          if (-not ($changelog | Select-String -SimpleMatch "## [$version]")) {
            Write-Error "CHANGELOG.md must include a section for [$version]."
            exit 1
          }

          # 空や前回の ReleaseNotes のまま提出されないよう、パッケージのビルド前に止める。
          ./scripts/Test-ListingData.ps1 -Directory PhotoGeoExplorer/Assets/propose -Version $version

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhotoGeoExplorer.sln

      - name: Build MSIX Bundle
        shell: pwsh
        run: ./scripts/Build-MsixUpload.ps1

      - name: Collect artifacts
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path PhotoGeoExplorer\AppPackages -Recurse -File -Include *.msixupload
          if (-not $packages) {
            Write-Error "No msixupload packages found."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($package in $packages) {
            Copy-Item $package.FullName -Destination artifacts -Force
          }

      # 提出する .msixupload と同じ中身の MSIX（Publisher と署名だけ差し替えたコピー）で WACK を実行する。
      # OVERALL_RESULT が PASS でなければここで失敗し、GitHub Release の作成と Partner Center への提出へ進まない。
      - name: WACK gate
        shell: pwsh
        run: ./scripts/Invoke-WackGate.ps1 -PackagesDir PhotoGeoExplorer\AppPackages -ManifestPath PhotoGeoExplorer/Package.appxmanifest -OutputDir wack-report

      # 不合格のときも、原因を読めるよう報告書を保存する。
      - name: Upload WACK report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: wack-report
          path: wack-report/
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content  = Get-Content -Path "CHANGELOG.md" -Raw
          $escaped  = [regex]::Escape($version)
          $pattern  = "(?ms)^## \[$escaped\][^\n]*\n(.*?)(?=^## \[|\z)"
          $m        = [regex]::Match($content, $pattern)
          $notes    = if ($m.Success) { $m.Groups[1].Value.Trim().Replace("`r`n", "`n").Replace("`r", "`n") } else { '' }
          $delim    = "GHDELIM$(Get-Random)"
          $nl       = "`n"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "NOTES<<$delim$nl$notes$nl$delim$nl", [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*
            wack-report/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.NOTES }}
          append_body: false

      - name: Submit to Partner Center
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          $msix = (Get-ChildItem artifacts/*.msixupload | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $listingDataFiles = @(Get-ChildItem PhotoGeoExplorer/Assets/propose/listingData-*.csv -File)
          if ($listingDataFiles.Count -ne 1) {
            $fileNames = if ($listingDataFiles.Count -eq 0) { "(none)" } else { $listingDataFiles.Name -join ", " }
            Write-Error "Expected exactly one listingData-*.csv file, but found $($listingDataFiles.Count): $fileNames"
            exit 1
          }
          $csv = $listingDataFiles[0].FullName
          pwsh ./scripts/Submit-ToPartnerCenter.ps1 -MsixUpload $msix -ListingDataCsv $csv
