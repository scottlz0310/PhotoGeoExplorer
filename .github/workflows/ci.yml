# GitHub Actions workflow for CI pipeline

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync check for agent guideline files
        shell: pwsh
        run: pwsh ./scripts/Sync-AgentDocs.ps1 -Check

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PhotoGeoExplorer.sln

      - name: Build (Debug for format)
        run: dotnet build PhotoGeoExplorer.sln -c Debug -p:Platform=${{ matrix.platform }}

      - name: Format check
        run: dotnet format --verify-no-changes PhotoGeoExplorer.sln

      - name: Build with analyzers
        run: dotnet build PhotoGeoExplorer.sln -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:TreatWarningsAsErrors=true -p:AnalysisLevel=latest

      - name: Ensure Windows App SDK runtime
        shell: pwsh
        run: |
          # 2.x のランタイムはマイナー単位ではなくメジャー単位の family 名で提供される。
          # 参照パッケージ (Microsoft.WindowsAppSDK) の Release.MajorMinor と調達バージョンを揃える。
          $runtime = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.2" -ErrorAction SilentlyContinue |
            Where-Object { [Version]$_.Version -ge [Version]"2.2" }
          if (-not $runtime) {
            $installerUri = "https://aka.ms/windowsappsdk/2.2/latest/windowsappruntimeinstall-x64.exe"
            $installerPath = Join-Path $env:RUNNER_TEMP "windowsappruntimeinstall-x64.exe"
            Invoke-WebRequest -Uri $installerUri -OutFile $installerPath
            $proc = Start-Process -FilePath $installerPath -ArgumentList "--quiet" -Wait -PassThru
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              Write-Warning "WindowsAppRuntimeInstall.exe failed (exit: $($proc.ExitCode))."
            }
          }

      - name: Check for outdated packages
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\\\(bin|obj)\\\\' }
          if (-not $projects) {
            Write-Error "No .csproj projects found for package checks."
            exit 1
          }
          foreach ($project in $projects) {
            Write-Host "Checking outdated packages: $($project.FullName)"
            $lines = dotnet list $project.FullName package --outdated
            $lines | ForEach-Object { $_ }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($lines | Select-String -Pattern '^\\s*>\\s') {
              Write-Error "Outdated NuGet packages detected. Update packages to the latest versions."
              exit 1
            }
          }

      - name: Test
        shell: pwsh
        run: |
          $testArgs = @(
            "PhotoGeoExplorer.Tests/PhotoGeoExplorer.Tests.csproj",
            "-c", "${{ matrix.configuration }}",
            "-p:Platform=${{ matrix.platform }}",
            "-p:TreatWarningsAsErrors=true",
            "-p:AnalysisLevel=latest",
            "-p:DebugType=portable",
            "-p:DebugSymbols=true",
            "--logger", "trx;LogFileName=test-results.trx",
            "--results-directory", "TestResults",
            "--collect", "XPlat Code Coverage",
            "--settings", "coverlet.runsettings",
            "--blame-hang-timeout", "10m"
          )
          dotnet test @testArgs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults/**/coverage.cobertura.xml
          flags: unittests
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.configuration }}-${{ matrix.platform }}
          path: TestResults/
